name: JARVIS public downloads

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate and build the Windows companion
        working-directory: desktop
        run: |
          npm ci
          npm run validate
          npm run dist:win
      - name: Stage Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem desktop/release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not generated.' }
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets/JARVIS-2.0.0-Desktop-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-installer
          path: release-assets/JARVIS-2.0.0-Desktop-Setup-x64.exe
          if-no-files-found: error
          retention-days: 3

  publish-release:
    needs: build-windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-windows-installer
          path: release-assets
      - name: Generate release checksums
        run: cd release-assets && sha256sum JARVIS-2.0.0-Desktop-Setup-x64.exe JARVIS-2.0.0-Android.apk > SHA256SUMS.txt
      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/JARVIS-2.0.0-Desktop-Setup-x64.exe release-assets/JARVIS-2.0.0-Android.apk release-assets/SHA256SUMS.txt --verify-tag --title "JARVIS 2.0.0" --notes "JARVIS 2.0.0 for Windows x64 and Android. The Android APK is signed and its certificate matches the JARVIS domain asset links. The Windows installer is not Authenticode-signed and may trigger Windows SmartScreen."
