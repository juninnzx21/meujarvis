name: JARVIS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jarvis_db
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jarvis:jarvis_password@localhost:5432/jarvis_db?schema=public
      JWT_SECRET: ci_only_change_me_not_for_production_123
      GEMINI_API_KEY: ci_test_gemini_key_for_mocked_transport_only
      CORS_ORIGIN: http://localhost:5173
      SETTINGS_ENCRYPTION_KEY: ci_only_32_chars_minimum_value
      ALLOW_DEMO_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend validate
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma validate
          npx prisma migrate deploy
          npx prisma db seed
          npm run test
          npm run build
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend validate
        working-directory: frontend
        run: |
          npm run test
          npm run build
      - name: Save web build for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Secret pattern smoke check
        shell: bash
        run: |
          ! git grep -nE "sk-proj-[A-Za-z0-9_-]{40,}|sk-[A-Za-z0-9_-]{48,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}" -- \
            ':!*.md' ':!*.example' ':!package-lock.json'

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Validate desktop companion
        working-directory: desktop
        run: npm run validate
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Save Windows build for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-${{ github.sha }}
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android validation APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Save Android build for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-test-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
