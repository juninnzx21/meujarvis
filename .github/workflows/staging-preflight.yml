name: JARVIS staging configuration preflight (no deployment)

on:
  pull_request:
    paths:
      - docker-compose.staging.yml
      - deploy/staging/**
      - .github/workflows/staging-preflight.yml
      - backend/.dockerignore
      - frontend/.dockerignore
  push:
    branches:
      - chatgpt/jarvis-3-master-20261021
    paths:
      - docker-compose.staging.yml
      - deploy/staging/**
      - .github/workflows/staging-preflight.yml
      - backend/.dockerignore
      - frontend/.dockerignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-config:
    runs-on: ubuntu-latest
    env:
      STAGING_POSTGRES_PASSWORD: ci_only_not_deployed_staging_password
      STAGING_DATABASE_URL: postgresql://jarvis_staging:ci_only_not_deployed_staging_password@postgres:5432/jarvis_staging?schema=public
      STAGING_JWT_SECRET: ci_only_not_deployed_jwt_secret_32_chars
      STAGING_SETTINGS_ENCRYPTION_KEY: ci_only_not_deployed_settings_key_32_chars
      STAGING_TOTP_ENCRYPTION_KEY: ci_only_not_deployed_totp_key_32_chars
      STAGING_HOST_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent staging Compose without starting containers
        run: docker compose --project-name jarvis3staging -f docker-compose.staging.yml config --quiet
      - name: Assert fail-closed isolation rules
        shell: python
        run: |
          import json, os, subprocess
          cmd = ["docker", "compose", "--project-name", "jarvis3staging", "-f", "docker-compose.staging.yml", "config", "--format", "json"]
          data = json.loads(subprocess.check_output(cmd, text=True))
          services = data["services"]
          assert set(services) == {"postgres", "backend", "frontend", "gateway"}
          assert not any("container_name" in value or "privileged" in value for value in services.values())
          assert all(not entry.get("ports") for name, entry in services.items() if name != "gateway")
          assert all(entry.get("host_ip") == "127.0.0.1" for entry in services["gateway"]["ports"])
          assert all("healthcheck" in entry for entry in services.values())
          backend_command = " ".join(services["backend"]["command"])
          assert "STAGING_DATABASE_TARGET_REJECTED" in backend_command
          assert "u.hostname!=='postgres'" in backend_command
          assert "u.port!=='5432'" in backend_command
          assert "u.pathname!=='/jarvis_staging'" in backend_command
          assert "decodeURIComponent(u.username)!=='jarvis_staging'" in backend_command
          assert "u.searchParams.has('host')" in backend_command
          assert "u.searchParams.has('hostaddr')" in backend_command
          assert "prisma migrate deploy" in backend_command
          assert backend_command.endswith("exec node dist/server.js")
          guard = backend_command.partition('node -e "')[2].partition('" &&')[0]
          assert guard, "missing executable staging database guard"
          guard_cases = [
            ("postgresql://jarvis_staging:synthetic@postgres:5432/jarvis_staging?schema=public", 0),
            ("postgresql://jarvis_staging:synthetic@127.0.0.1:5432/jarvis_staging", 1),
            ("postgresql://jarvis_staging:synthetic@postgres:5432/testprod", 1),
            ("postgresql://jarvis_staging:synthetic@postgres:5433/jarvis_staging", 1),
            ("postgresql://other:synthetic@postgres:5432/jarvis_staging", 1),
            ("postgresql://jarvis_staging:synthetic@other:5432/jarvis_staging", 1),
            ("postgresql://jarvis_staging:synthetic@postgres:5432/jarvis_staging?host=127.0.0.1", 1),
            ("postgresql://jarvis_staging:synthetic@postgres:5432/jarvis_staging?hostaddr=127.0.0.1", 1),
            ("not-a-database-url", 1),
          ]
          for database_url, expected in guard_cases:
            result = subprocess.run(["node", "-e", guard], env={**os.environ, "DATABASE_URL": database_url}, capture_output=True, text=True)
            assert result.returncode == expected, f"staging database guard mismatch for test input (expected {expected})"
          for entry in services.values():
            limits = entry["deploy"]["resources"]["limits"]
            assert limits.get("memory") and limits.get("cpus")
          env = services["backend"]["environment"]
          assert env["SCHEDULER_ENABLED"] == "false"
          assert env["WHATSAPP_AUTO_REPLY"] == "false"
          assert env["ALLOW_DEMO_LOGIN"] == "false"
          assert not env.get("OPENAI_API_KEY") and not env.get("GEMINI_API_KEY")
          assert not env.get("EVOLUTION_API_KEY") and not env.get("HOME_ASSISTANT_TOKEN")
          assert data["name"] == "jarvis3staging"
          assert data["networks"]["staging_private"]["internal"] is True
          assert set(services["gateway"]["networks"]) == {"staging_private", "staging_edge"}
          assert all(set(services[name]["networks"]) == {"staging_private"} for name in ["postgres", "backend", "frontend"])
          assert "staging_edge" in data["networks"]
          postgres_volume = services["postgres"]["volumes"][0]
          assert postgres_volume["source"] == "staging_postgres" and not postgres_volume.get("external", False)
          print("Staging isolation policy: PASS (configuration only, no deploy)")
