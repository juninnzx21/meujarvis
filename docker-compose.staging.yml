# Dedicated staging stack. Never combine with docker-compose.yml.
# Always use: docker compose --project-name jarvis3staging -f docker-compose.staging.yml ...
# Staging is deliberately bound to loopback. No production services, HA, n8n, real provider keys or auto-deploy.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jarvis_staging
      POSTGRES_USER: jarvis_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set an isolated strong password in your private staging environment}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    networks: [staging_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_staging -d jarvis_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${STAGING_DATABASE_URL:?Set a private staging-only URL for the postgres service}
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set a separate test-only JWT key}
      SETTINGS_ENCRYPTION_KEY: ${STAGING_SETTINGS_ENCRYPTION_KEY:?Set a separate staging settings key}
      TOTP_ENCRYPTION_KEY: ${STAGING_TOTP_ENCRYPTION_KEY:?Set a separate staging TOTP key}
      CORS_ORIGIN: http://127.0.0.1:18080
      ALLOW_DEMO_LOGIN: "false"
      SCHEDULER_ENABLED: "false"
      WHATSAPP_AUTO_REPLY: "false"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      N8N_WEBHOOK_URL: ""
      EVOLUTION_API_URL: ""
      EVOLUTION_API_KEY: ""
      HOME_ASSISTANT_URL: ""
      HOME_ASSISTANT_TOKEN: ""
      PIPER_TTS_URL: ""
    networks: [staging_private]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(async r=>{const j=await r.json();process.exit(r.ok&&j.readiness==='ready'&&j.database==='ok'?0:1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    networks: [staging_private]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_HOST_PORT:-18080}:8080"
    volumes:
      - ./deploy/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [staging_private, staging_edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

volumes:
  staging_postgres:

networks:
  staging_private:
    driver: bridge
    internal: true
  staging_edge:
    driver: bridge
